# Docker Compose override for GPU deployment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# This file adds NVIDIA GPU support for systems with NVIDIA GPUs and nvidia-docker
# installed. It overrides ONLY the `worker` service, which is the sole service that
# ever touches CUDA (the GPU-bound meeting transcription/diarization pipeline).
# `backend` and `worker-light` stay on the "light" target in every deployment — they
# can't reach a GPU (no `devices:` reservation) and gain nothing from a CUDA base.

services:
  worker:
    build:
      context: ./backend
      target: heavy
      args:
        WITH_HEAVY: "true"
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 4G
