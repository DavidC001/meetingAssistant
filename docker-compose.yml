services:
  backend:
    build:
      context: ./backend
      target: light
    ports:
      - "8000:8000"
    volumes:
      - cache_data:/app/cache
      - uploads_data:/app/uploads
      - ./backend/.env:/app/.env  # Mount env file so runtime writes are visible
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://user:password@db/mydatabase
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes: []
    depends_on:
      - backend
    restart: unless-stopped

  # GPU-bound meeting pipeline only. --pool=solo processes one task at a time, which is
  # required for CUDA safety but means anything else sharing this worker would queue
  # behind an hour-long transcription — hence the "heavy" queue and the separate
  # worker-light service below for everything else.
  worker:
    build:
      context: ./backend
      target: heavy
      args:
        WITH_HEAVY: "true"
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--pool=solo", "-Q", "heavy"]
    volumes:
      - cache_data:/app/cache
      - uploads_data:/app/uploads
      - ./backend/.env:/app/.env  # Mount env file so runtime writes are visible
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://user:password@db/mydatabase
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # Embeddings, Drive sync, note/attachment indexing, diary — no GPU, so real
  # concurrency is safe here and keeps these off the heavy worker's single-task queue.
  # Also runs the embedded beat scheduler (-B) for the Drive-sync periodic task: safe
  # because there is exactly one replica of this service. If you ever scale
  # worker-light past one replica, pull beat back out into its own service first —
  # otherwise the periodic task fires once per replica.
  worker-light:
    build:
      context: ./backend
      target: light
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=info",
        "--pool=threads",
        "--concurrency=4",
        "-Q",
        "light",
        "-B",
        "--schedule=/app/cache/celerybeat-schedule",
      ]
    volumes:
      - cache_data:/app/cache
      - uploads_data:/app/uploads
      - ./backend/.env:/app/.env  # Mount env file so runtime writes are visible
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://user:password@db/mydatabase
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  db:
    image: pgvector/pgvector:pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Ollama service (optional). The app talks to Ollama over HTTP via OLLAMA_BASE_URL —
  # point that at wherever Ollama actually runs. Uncomment this to also run it as a
  # docker-compose service, or point OLLAMA_BASE_URL at an Ollama instance you manage
  # separately.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

volumes:
  postgres_data:
  cache_data:
  uploads_data:
  ollama_data:
